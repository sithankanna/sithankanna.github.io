<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-labelledby="title desc">
  <title id="title">A zero-layer bigram model</title>
  <desc id="desc">The current token b selects row b from a three by three weight matrix. Softmax turns that row into next-token probabilities.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#252825"/>
    </marker>
  </defs>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#252825">
    <text x="62" y="48" text-anchor="middle" font-size="12" fill="#686e68">current token</text>
    <rect x="16" y="64" width="92" height="58" rx="6" fill="#ffffff" stroke="#9aa09a"/>
    <text x="62" y="99" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic">x<tspan dy="4" font-size="12">t</tspan><tspan dy="-4" font-size="21"> = b</tspan></text>

    <line x1="108" y1="93" x2="172" y2="93" stroke="#252825" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="140" y="80" text-anchor="middle" font-size="11" fill="#686e68">select row</text>

    <text x="284" y="24" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic">W</text>
    <text x="223" y="47" text-anchor="middle" font-size="11" fill="#686e68">next a</text>
    <text x="284" y="47" text-anchor="middle" font-size="11" fill="#686e68">next b</text>
    <text x="345" y="47" text-anchor="middle" font-size="11" fill="#686e68">next _</text>
    <text x="185" y="77" text-anchor="middle" font-size="12" fill="#686e68">a</text>
    <text x="185" y="111" text-anchor="middle" font-size="12" font-weight="700">b</text>
    <text x="185" y="145" text-anchor="middle" font-size="12" fill="#686e68">_</text>

    <rect x="198" y="55" width="172" height="102" rx="4" fill="#ffffff" stroke="#9aa09a"/>
    <rect x="199" y="89" width="170" height="34" fill="#d9ebf8"/>
    <line x1="198" y1="89" x2="370" y2="89" stroke="#d9ddd8"/>
    <line x1="198" y1="123" x2="370" y2="123" stroke="#d9ddd8"/>
    <line x1="255" y1="55" x2="255" y2="157" stroke="#d9ddd8"/>
    <line x1="313" y1="55" x2="313" y2="157" stroke="#d9ddd8"/>
    <text x="227" y="77" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic">w<tspan dy="3" font-size="9">aa</tspan></text>
    <text x="284" y="77" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic">w<tspan dy="3" font-size="9">ab</tspan></text>
    <text x="341" y="77" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic">w<tspan dy="3" font-size="9">a_</tspan></text>
    <text x="227" y="111" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic">w<tspan dy="3" font-size="9">ba</tspan></text>
    <text x="284" y="111" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic">w<tspan dy="3" font-size="9">bb</tspan></text>
    <text x="341" y="111" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic">w<tspan dy="3" font-size="9">b_</tspan></text>
    <text x="227" y="145" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic">w<tspan dy="3" font-size="9">_a</tspan></text>
    <text x="284" y="145" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic">w<tspan dy="3" font-size="9">_b</tspan></text>
    <text x="341" y="145" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic">w<tspan dy="3" font-size="9">__</tspan></text>
    <text x="284" y="181" text-anchor="middle" font-size="11" fill="#686e68">3 tokens x 3 logits</text>

    <line x1="370" y1="106" x2="427" y2="106" stroke="#252825" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="399" y="93" text-anchor="middle" font-size="11" fill="#686e68">row b</text>

    <rect x="434" y="78" width="98" height="56" rx="6" fill="#fce6cd" stroke="#d18a2a"/>
    <text x="483" y="111" text-anchor="middle" font-size="14">softmax</text>

    <line x1="532" y1="106" x2="578" y2="106" stroke="#252825" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="643" y="48" text-anchor="middle" font-size="12" fill="#686e68">next-token probabilities</text>
    <rect x="585" y="64" width="119" height="84" rx="6" fill="#ffffff" stroke="#9aa09a"/>
    <text x="644" y="91" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14">P(a | b)</text>
    <text x="644" y="111" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14">P(b | b)</text>
    <text x="644" y="131" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14">P(_ | b)</text>
  </g>
</svg>
