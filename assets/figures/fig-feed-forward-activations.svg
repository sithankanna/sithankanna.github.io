<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 255" width="760" height="255" font-family="Georgia, 'Times New Roman', serif" fill="#252825" role="img" aria-label="Feed-forward activation flow. The upward projection creates 4 B T d embedding values, the activation function creates another 4 B T d embedding values, and the downward projection creates B T d embedding values.">
  <defs>
    <marker id="arrow-ff" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#252825"/>
    </marker>
  </defs>
  <style>
    .math { font-family: "Times New Roman", Times, serif; font-style: italic; }
    .sub { font-style: normal; }
  </style>

  <text x="380" y="23" text-anchor="middle" font-size="15" font-weight="bold">Saved activations in the feed-forward layer</text>

  <g stroke="#252825" stroke-width="1.3" fill="none" marker-end="url(#arrow-ff)">
    <line x1="83" y1="111" x2="122" y2="111"/>
    <line x1="190" y1="111" x2="224" y2="111"/>
    <line x1="332" y1="111" x2="369" y2="111"/>
    <line x1="477" y1="111" x2="512" y2="111"/>
    <line x1="580" y1="111" x2="602" y2="111"/>
    <line x1="670" y1="111" x2="687" y2="111"/>
    <path d="M83 124 L98 124 L98 190 L704 190 L704 132"/>
  </g>

  <rect x="18" y="84" width="65" height="54" rx="6" fill="#e8f0fa" stroke="#3f6fa0" stroke-width="1.3"/>
  <text x="50.5" y="107" text-anchor="middle" font-size="14" font-weight="bold">Input</text>
  <text class="math" x="50.5" y="126" text-anchor="middle" font-size="10.5" fill="#3f6fa0">BTd<tspan class="sub" baseline-shift="sub" font-size="7.5">emb</tspan></text>

  <rect x="122" y="81" width="68" height="60" rx="5" fill="#fae0e0" stroke="#c06a6a" stroke-width="1.3"/>
  <text x="156" y="116" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic">W<tspan baseline-shift="sub" font-size="9">up</tspan></text>

  <rect x="224" y="73" width="108" height="76" rx="6" fill="#fdeded" stroke="#c06a6a" stroke-width="1.3"/>
  <text x="278" y="101" text-anchor="middle" font-size="13" font-weight="bold">expanded</text>
  <text x="278" y="119" text-anchor="middle" font-size="13" font-weight="bold">representation</text>
  <text class="math" x="278" y="138" text-anchor="middle" font-size="10.5" fill="#a94f4f">4BTd<tspan class="sub" baseline-shift="sub" font-size="7.5">emb</tspan></text>

  <circle cx="423" cy="111" r="54" fill="#fcf1c9" stroke="#c9ab3f" stroke-width="1.3"/>
  <text x="423" y="103" text-anchor="middle" font-size="14" font-weight="bold">activation</text>
  <text x="423" y="121" text-anchor="middle" font-size="12">GELU / SiLU</text>
  <text class="math" x="423" y="139" text-anchor="middle" font-size="10.5" fill="#8c7629">4BTd<tspan class="sub" baseline-shift="sub" font-size="7.5">emb</tspan></text>

  <rect x="512" y="81" width="68" height="60" rx="5" fill="#fae0e0" stroke="#c06a6a" stroke-width="1.3"/>
  <text x="546" y="116" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic">W<tspan baseline-shift="sub" font-size="9">down</tspan></text>

  <rect x="602" y="84" width="68" height="54" rx="6" fill="#fdeded" stroke="#c06a6a" stroke-width="1.3"/>
  <text x="636" y="107" text-anchor="middle" font-size="13" font-weight="bold">output</text>
  <text class="math" x="636" y="126" text-anchor="middle" font-size="10.5" fill="#a94f4f">BTd<tspan class="sub" baseline-shift="sub" font-size="7.5">emb</tspan></text>

  <circle cx="704" cy="111" r="17" fill="#fcf1c9" stroke="#c9ab3f" stroke-width="1.3"/>
  <text x="704" y="117" text-anchor="middle" font-size="20">+</text>
  <text x="704" y="152" text-anchor="middle" font-size="10.5" fill="#686e68">residual</text>

  <line x1="721" y1="111" x2="748" y2="111" stroke="#252825" stroke-width="1.3" marker-end="url(#arrow-ff)"/>

  <rect x="243" y="211" width="274" height="32" rx="16" fill="#fdeded" stroke="#d8a1a1"/>
  <text x="380" y="232" text-anchor="middle" font-size="13">
    saved feed-forward values = <tspan class="math" font-weight="bold">9BTd</tspan><tspan class="sub" baseline-shift="sub" font-size="9" font-weight="bold">emb</tspan>
  </text>
</svg>
