<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="Georgia, 'Times New Roman', serif" fill="#252825" role="img" aria-label="Pre-norm transformer block with LayerNorm before self-attention and before the feed-forward layer. The two LayerNorm outputs each contain B T d embedding values.">
  <defs>
    <marker id="arrow-ln" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#252825"/>
    </marker>
  </defs>
  <style>
    .math { font-family: "Times New Roman", Times, serif; font-style: italic; }
    .sub { font-style: normal; }
  </style>

  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="bold">LayerNorm inside one pre-norm transformer block</text>

  <g stroke="#252825" stroke-width="1.3" fill="none" marker-end="url(#arrow-ln)">
    <line x1="62" y1="112" x2="106" y2="112"/>
    <line x1="192" y1="112" x2="224" y2="112"/>
    <line x1="326" y1="112" x2="352" y2="112"/>
    <line x1="386" y1="112" x2="420" y2="112"/>
    <line x1="506" y1="112" x2="536" y2="112"/>
    <line x1="628" y1="112" x2="654" y2="112"/>
    <path d="M62 112 L78 112 L78 54 L363 54 L363 90"/>
    <path d="M386 112 L402 112 L402 178 L665 178 L665 134"/>
  </g>

  <text x="22" y="117" font-size="17" font-weight="bold" font-style="italic">X<tspan font-size="10" font-weight="normal" dy="4">ℓ</tspan></text>

  <rect x="108" y="82" width="84" height="60" rx="6" fill="#f1eafa" stroke="#8a67b5" stroke-width="1.3"/>
  <text x="150" y="107" text-anchor="middle" font-size="13" font-weight="bold">LayerNorm</text>
  <text class="math" x="150" y="126" text-anchor="middle" font-size="11" fill="#674a8c">BTd<tspan class="sub" baseline-shift="sub" font-size="8">emb</tspan></text>

  <rect x="226" y="82" width="100" height="60" rx="6" fill="#eef8ee" stroke="#4a8a4a" stroke-width="1.3"/>
  <text x="276" y="106" text-anchor="middle" font-size="13" font-weight="bold">Self-</text>
  <text x="276" y="124" text-anchor="middle" font-size="13" font-weight="bold">Attention</text>

  <circle cx="369" cy="112" r="17" fill="#fcf1c9" stroke="#c9ab3f" stroke-width="1.3"/>
  <text x="369" y="118" text-anchor="middle" font-size="20">+</text>
  <text x="369" y="152" text-anchor="middle" font-size="11" fill="#686e68">first residual</text>

  <rect x="422" y="82" width="84" height="60" rx="6" fill="#f1eafa" stroke="#8a67b5" stroke-width="1.3"/>
  <text x="464" y="107" text-anchor="middle" font-size="13" font-weight="bold">LayerNorm</text>
  <text class="math" x="464" y="126" text-anchor="middle" font-size="11" fill="#674a8c">BTd<tspan class="sub" baseline-shift="sub" font-size="8">emb</tspan></text>

  <rect x="538" y="82" width="90" height="60" rx="6" fill="#fdeded" stroke="#c06a6a" stroke-width="1.3"/>
  <text x="583" y="107" text-anchor="middle" font-size="13" font-weight="bold">Feed-</text>
  <text x="583" y="125" text-anchor="middle" font-size="13" font-weight="bold">Forward</text>

  <circle cx="671" cy="112" r="17" fill="#fcf1c9" stroke="#c9ab3f" stroke-width="1.3"/>
  <text x="671" y="118" text-anchor="middle" font-size="20">+</text>
  <text x="671" y="152" text-anchor="middle" font-size="11" fill="#686e68">second residual</text>

  <line x1="688" y1="112" x2="722" y2="112" stroke="#252825" stroke-width="1.3" marker-end="url(#arrow-ln)"/>
  <text x="731" y="117" font-size="17" font-weight="bold" font-style="italic">X<tspan font-size="10" font-weight="normal" dy="4">ℓ+1</tspan></text>

  <rect x="214" y="204" width="332" height="34" rx="17" fill="#f5f0fb" stroke="#b9a4d2"/>
  <text x="380" y="226" text-anchor="middle" font-size="13">
    two saved LayerNorm outputs = <tspan class="math" font-weight="bold">2BTd</tspan><tspan class="sub" baseline-shift="sub" font-size="9" font-weight="bold">emb</tspan>
  </text>
</svg>
